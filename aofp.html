<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090d15" />
  <meta name="description" content="AÖF dört ders çalışma ve ünite ilerleme takip paneli" />
  <title>AÖF Çalışma Paneli · Berkay</title>
  <link rel="stylesheet" href="aof.css" />
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="icons.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/11.8.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/11.8.1/firebase-database-compat.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#genel" aria-label="Ana sayfa">
        <span class="brand-icon"><i data-lucide="layers-3"></i></span>
        <span><strong>study<span class="brand-dot">.</span>flow</strong><small>KİŞİSEL ÇALIŞMA ALANI</small></span>
      </a>
      <div class="nav-label">ÇALIŞMA ALANIM</div>
      <nav id="mainNav" class="main-nav" aria-label="Ana menü">
        <button class="nav-link active" data-view="genel"><i data-lucide="layout-dashboard"></i><span>Genel Bakış</span></button>
        <button class="nav-link" data-view="dersler"><i data-lucide="book-open"></i><span>Dersler ve Üniteler</span></button>
        <button class="nav-link" data-view="kayitlar"><i data-lucide="calendar-clock"></i><span>Çalışma Geçmişi</span></button>
        <button class="nav-link" data-view="denemeler"><i data-lucide="clipboard-check"></i><span>Deneme Sonuçları</span></button>
        <button class="nav-link mobile-settings" data-view="ayarlar"><i data-lucide="settings-2"></i><span>Ayarlar</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-hint"><i data-lucide="target"></i><div><strong>05 Aralık 2026</strong><span>Güz dönemi ara sınavı</span></div></div>
        <button id="settingsNav" class="nav-link nav-settings" data-view="ayarlar"><i data-lucide="settings-2"></i><span>Ayarlar / Yedek</span></button>
        <div class="profile"><div class="avatar">B</div><div><strong>Berkay</strong><span>Anadolu AÖF · 2026–27</span></div><i data-lucide="chevrons-up-down"></i></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="crumb"><span>Çalışma alanım</span><i data-lucide="chevron-right"></i><strong id="breadcrumb">Genel Bakış</strong></div>
        <div class="top-actions"><div id="syncStatus" class="sync-status"><span class="status-dot"></span><span>Bağlanıyor...</span></div><span class="header-date" id="todayDate"></span><button id="addTestTop" class="btn btn-primary btn-small"><i data-lucide="plus"></i><span>Deneme Ekle</span></button></div>
      </header>
      <div class="content">
        <section id="view-genel" class="view active"></section>
        <section id="view-dersler" class="view"></section>
        <section id="view-kayitlar" class="view"></section>
        <section id="view-denemeler" class="view"></section>
        <section id="view-ayarlar" class="view"></section>
      </div>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><span class="eyebrow">ÇALIŞMA KAYDI</span><h2 id="modalTitle">Yeni kayıt</h2></div><button class="icon-btn" id="closeModal" aria-label="Kapat"><i data-lucide="x"></i></button></div>
      <form id="modalForm" class="modal-body"></form>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
