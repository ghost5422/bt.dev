<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vardiya Yönetimi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#f6f8fb;color:#111827}
.shift-pill{display:inline-flex;align-items:center;justify-content:center;width:100%;min-width:76px;max-width:96px;padding:8px 6px;border-radius:9px;font-weight:700;color:#111827;text-align:center;cursor:pointer;user-select:none;transition:.12s;font-size:12px}
.shift-pill:active{transform:scale(.95)}
.GECE{background:#fecaca}.SABAH{background:#bfdbfe}.İZİN{background:#bbf7d0}
.today-row{background:#eff6ff!important;box-shadow:inset 4px 0 #2563eb}
.today-badge{display:inline-block;margin-left:5px;padding:2px 5px;border-radius:5px;background:#2563eb;color:#fff;font-size:8px;font-weight:800}
@media print{
@page{size:A4 portrait;margin:5mm!important}
body{background:#fff!important;padding:0!important;margin:0!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
.no-print{display:none!important}
.print-container{box-shadow:none!important;padding:0!important;margin:0!important;width:100%!important;max-width:none!important;border:none!important}
.header-area{padding-bottom:4px!important;margin-bottom:4px!important;border-bottom:1px solid #e5e7eb!important}
h1{font-size:14pt!important;margin:0!important}
table{width:100%!important;border-collapse:collapse!important}
th{font-size:9pt!important;padding:3px!important;border-bottom:2px solid #000!important;color:#000!important}
td{padding:2px!important;height:24px!important;border-bottom:1px solid #f3f4f6!important}
.date-col{font-size:9pt!important;color:#000!important}
.day-name{font-size:7.5pt!important;color:#4b5563!important}
.shift-pill{padding:2px 0!important;font-size:8.5pt!important;height:auto!important;border-radius:4px!important}
.today-row{background:transparent!important;box-shadow:none!important}
.today-badge{display:none!important}
.delete-btn{display:none!important}
}
</style>
</head>
<body class="p-3 md:p-6">

<div class="max-w-6xl mx-auto">

<div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-y-[-100px] opacity-0 bg-emerald-600 text-white font-semibold px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2">
<span class="material-symbols-outlined text-sm">check_circle</span>
<span>Kaydedildi</span>
</div>

<section class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 md:p-5 mb-5 no-print">
<div class="flex items-center gap-3 mb-5">
<div class="w-9 h-9 rounded-lg bg-blue-50 text-blue-600 inline-flex items-center justify-center flex-none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
</div>
<div>
<h1 class="text-xl font-bold text-gray-900">Vardiya Yönetimi</h1>
<p class="text-xs text-gray-500 mt-0.5">Personelleri yönet, aylık vardiyayı düzenle ve kaydet</p>
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-12 gap-3 mb-4">
<div class="md:col-span-3">
<label class="block text-xs font-semibold text-gray-500 mb-1.5">Ay</label>
<select id="monthSelect" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50 outline-none font-semibold text-sm">
<option value="0">Ocak</option><option value="1">Şubat</option><option value="2">Mart</option><option value="3">Nisan</option><option value="4">Mayıs</option><option value="5">Haziran</option><option value="6">Temmuz</option><option value="7">Ağustos</option><option value="8">Eylül</option><option value="9">Ekim</option><option value="10">Kasım</option><option value="11">Aralık</option>
</select>
</div>
<div class="md:col-span-2">
<label class="block text-xs font-semibold text-gray-500 mb-1.5">Yıl</label>
<select id="yearSelect" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50 outline-none font-semibold text-sm"></select>
</div>
<div class="md:col-span-2 flex items-end">
<button onclick="loadMonth()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-2.5 px-4 rounded-xl flex items-center justify-center gap-1.5 text-sm h-[42px]">
<span class="material-symbols-outlined text-base">refresh</span> Planı Yükle
</button>
</div>
<div class="md:col-span-5 flex items-end gap-2">
<div class="w-full">
<label class="block text-xs font-semibold text-gray-500 mb-1.5">Personel Ekle</label>
<input id="personNameInput" type="text" placeholder="İsim soyisim gir..." class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50 outline-none font-semibold text-sm h-[42px]">
</div>
<button onclick="addPerson()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 rounded-xl flex items-center justify-center gap-1 text-sm h-[42px] whitespace-nowrap">
<span class="material-symbols-outlined text-base">person_add</span> Ekle
</button>
</div>
</div>

<div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-gray-100">
<div class="flex flex-wrap gap-2">
<button onclick="saveCurrentMonth()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-base">save</span> KAYDET
</button>
<button onclick="resetMonth()" class="bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold px-4 py-2.5 rounded-xl text-sm flex items-center gap-1.5">
<span class="material-symbols-outlined text-base">restart_alt</span> Orijinale Döndür
</button>
<button onclick="window.print()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-4 py-2.5 rounded-xl text-sm flex items-center gap-1.5">
<span class="material-symbols-outlined text-base">print</span> PDF / Yazdır
</button>
</div>
<p class="text-xs text-gray-400">Vardiya sırası: Gece → Sabah → İzin</p>
</div>
</section>

<section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 md:p-6 print-container">
<div class="text-center header-area pb-4 mb-4 border-b border-gray-200">
<h2 id="tableTitle" class="text-xl md:text-2xl font-bold text-gray-900 uppercase">AY YIL VARDİYASI</h2>
</div>
<div class="overflow-x-auto">
<table class="w-full text-center min-w-[500px]">
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</section>

</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyBKUs5FM50ejN9tVdvUNzocRGU5Q5lD2eo",
authDomain: "urunrakip.firebaseapp.com",
databaseURL: "https://urunrakip-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "urunrakip",
storageBucket: "urunrakip.appspot.com",
messagingSenderId: "893193039416",
appId: "1:893193039416:web:8624c79038f5dc9a2ac0cd"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getDatabase(app);

// Referans başlangıç tarihi: 24 Eylül 2026 Perşembe
const anchorDate = new Date(Date.UTC(2026, 8, 24));

// 24 Eylül Perşembe gününden başlayan döngüler
const pattern2 = ["GECE", "GECE", "İZİN", "İZİN", "SABAH", "SABAH"];
const pattern3 = ["SABAH", "SABAH", "GECE", "GECE", "İZİN", "İZİN"];
const pattern4 = ["İZİN", "İZİN", "SABAH", "SABAH", "GECE", "GECE"];

const ayIsimleri = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const gunIsimleri = ["Pazar","Pzt","Salı","Çarş","Perş","Cuma","Cmt"];

let currentMonth = null;
let currentYear = null;
let personnelList = [];
let monthData = {};

function showToast(msg = "Kaydedildi") {
const toast = document.getElementById("toast");
toast.querySelector("span:last-child").innerText = msg;
toast.classList.remove("translate-y-[-100px]", "opacity-0");
setTimeout(() => {
toast.classList.add("translate-y-[-100px]", "opacity-0");
}, 2500);
}

function getShiftByCycle(targetDate, cycle) {
const ms = 86400000;
const t = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
const diff = Math.round((t - anchorDate) / ms);
let index = diff % 6;
if (index < 0) index += 6;
return cycle[index];
}

function getAutoShift(personIndex, date) {
if (personIndex === 0) return "SABAH";
if (personIndex === 1) return getShiftByCycle(date, pattern2);
if (personIndex === 2) return getShiftByCycle(date, pattern3);
if (personIndex === 3) return getShiftByCycle(date, pattern4);
return "İZİN";
}

async function fetchPersonnel() {
try {
const snap = await get(ref(db, "personeller"));
if (snap.exists()) {
const val = snap.val();
if (Array.isArray(val)) {
personnelList = val.filter(Boolean);
} else if (typeof val === "object") {
personnelList = Object.keys(val).map(k => val[k]);
} else {
personnelList = [];
}
} else {
personnelList = [];
}
} catch (e) {
console.error("Personel getirme hatası:", e);
personnelList = [];
}
}

window.addPerson = async function() {
const input = document.getElementById("personNameInput");
const name = input.value.trim();
if (!name) return;
const newPerson = { id: "p_" + Date.now(), name: name };
personnelList.push(newPerson);
try {
await set(ref(db, "personeller"), personnelList);
input.value = "";
renderTable();
showToast("Personel eklendi");
} catch (e) {
console.error("Personel ekleme hatası:", e);
alert("Personel kaydedilemedi.");
}
};

window.deletePerson = async function(id) {
const p = personnelList.find(item => item.id === id);
if (!p) return;
if (!confirm(`"${p.name}" adlı personeli silmek istediğinize emin misiniz?`)) return;
personnelList = personnelList.filter(item => item.id !== id);
try {
await set(ref(db, "personeller"), personnelList);
renderTable();
showToast("Personel silindi");
} catch (e) {
console.error("Personel silme hatası:", e);
alert("Personel silinemedi.");
}
};

window.loadMonth = async function() {
currentMonth = parseInt(document.getElementById("monthSelect").value);
currentYear = parseInt(document.getElementById("yearSelect").value);
await fetchPersonnel();

const path = `vardiyalar/${currentYear}/${currentMonth + 1}`;
try {
const snap = await get(ref(db, path));
if (snap.exists()) {
monthData = snap.val() || {};
} else {
monthData = {};
}
} catch (e) {
console.error("Vardiya getirme hatası:", e);
monthData = {};
}
renderTable();
};

function renderTable() {
document.getElementById("tableTitle").innerText = `${ayIsimleri[currentMonth]} ${currentYear} VARDİYASI`;
const thead = document.getElementById("tableHead");
const tbody = document.getElementById("tableBody");

if (personnelList.length === 0) {
thead.innerHTML = `<tr><th class="py-3 px-2 text-center text-gray-500 font-semibold">Tarih</th></tr>`;
tbody.innerHTML = `<tr><td class="py-8 text-center text-gray-400 font-medium text-sm">Henüz personel eklenmedi. Yukarıdaki alandan personel ekleyebilirsiniz.</td></tr>`;
return;
}

let headHtml = `<tr><th class="py-3 px-3 text-left text-gray-700 font-bold border-b-2 border-gray-800 w-32">Tarih</th>`;
personnelList.forEach(p => {
headHtml += `<th class="py-3 px-2 text-center text-gray-800 font-bold border-b-2 border-gray-800 min-w-[100px]">
<div class="inline-flex items-center justify-center gap-1.5">
<span>${p.name}</span>
<button onclick="deletePerson('${p.id}')" class="delete-btn text-gray-400 hover:text-red-600 transition-colors inline-flex items-center" title="Personeli Sil">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</th>`;
});
headHtml += `</tr>`;
thead.innerHTML = headHtml;

tbody.innerHTML = "";
const days = new Date(currentYear, currentMonth + 1, 0).getDate();
const today = new Date();

for (let day = 1; day <= days; day++) {
const date = new Date(currentYear, currentMonth, day);
const dayKey = String(day).padStart(2, "0");
const isToday = date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth() && date.getDate() === today.getDate();

const tr = document.createElement("tr");
tr.className = "border-b border-gray-100 hover:bg-gray-50 " + (isToday ? "today-row" : "");

let rowHtml = `<td class="py-2.5 px-3 text-left date-col font-bold whitespace-nowrap">${day}<span class="day-name font-normal ml-1">${gunIsimleri[date.getDay()]}</span>${isToday ? '<span class="today-badge">BUGÜN</span>' : ""}</td>`;

personnelList.forEach((p, idx) => {
let shift;
if (monthData[dayKey] && monthData[dayKey][p.id]) {
shift = monthData[dayKey][p.id];
} else {
shift = getAutoShift(idx, date);
}
rowHtml += `<td class="py-2 px-1">
<span class="shift-pill ${shift}" data-day="${dayKey}" data-pid="${p.id}" data-shift="${shift}" onclick="window.toggleShiftCell(this)">${shift}</span>
</td>`;
});

tr.innerHTML = rowHtml;
tbody.appendChild(tr);
}
}

window.toggleShiftCell = function(element) {
const dayKey = element.dataset.day;
const pid = element.dataset.pid;
const oldShift = element.dataset.shift;
const nextShift = oldShift === "GECE" ? "SABAH" : oldShift === "SABAH" ? "İZİN" : "GECE";

if (!monthData[dayKey]) monthData[dayKey] = {};
monthData[dayKey][pid] = nextShift;

element.dataset.shift = nextShift;
element.className = `shift-pill ${nextShift}`;
element.innerText = nextShift;
};

window.saveCurrentMonth = async function() {
if (personnelList.length === 0) {
alert("Kaydedilecek personel bulunmuyor.");
return;
}
const days = new Date(currentYear, currentMonth + 1, 0).getDate();
const fullData = {};

for (let day = 1; day <= days; day++) {
const dayKey = String(day).padStart(2, "0");
const date = new Date(currentYear, currentMonth, day);
fullData[dayKey] = {};
personnelList.forEach((p, idx) => {
if (monthData[dayKey] && monthData[dayKey][p.id]) {
fullData[dayKey][p.id] = monthData[dayKey][p.id];
} else {
fullData[dayKey][p.id] = getAutoShift(idx, date);
}
});
}

const path = `vardiyalar/${currentYear}/${currentMonth + 1}`;
try {
await set(ref(db, path), fullData);
monthData = fullData;
showToast("Kaydedildi");
} catch (e) {
console.error("Kaydetme hatası:", e);
alert("Vardiya kaydedilemedi.");
}
};

window.resetMonth = async function() {
if (!confirm(`${ayIsimleri[currentMonth]} ${currentYear} ayının kayıtlı planı silinecek ve otomatik örüntüye dönülecek. Devam edilsin mi?`)) return;
const path = `vardiyalar/${currentYear}/${currentMonth + 1}`;
try {
await remove(ref(db, path));
monthData = {};
renderTable();
showToast("Orijinal düzene dönüldü");
} catch (e) {
console.error("Sıfırlama hatası:", e);
alert("Sıfırlama sırasında hata oluştu.");
}
};

window.onload = function() {
const now = new Date();
const ys = document.getElementById("yearSelect");
for (let y = 2024; y <= now.getFullYear() + 5; y++) {
const opt = document.createElement("option");
opt.value = y;
opt.innerText = y;
if (y === now.getFullYear()) opt.selected = true;
ys.appendChild(opt);
}
document.getElementById("monthSelect").value = now.getMonth();
loadMonth();
};
</script>
</body>
</html>
