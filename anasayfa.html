<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapalıyız / Closed</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .font-sign {
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.18em;
    }

    /* Cam Pencere / Vitrin Arka Plan Hissi */
    .glass-window {
      background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.8) 100%),
                  repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0, rgba(255, 255, 255, 0.015) 1px, transparent 0, transparent 40px);
    }

    /* Gerçekçi Sarkaç (Pendulum) Salınım Animasyonu */
    @keyframes realisticSwing {
      0% {
        transform: rotate(3.2deg);
      }
      50% {
        transform: rotate(-3.2deg);
      }
      100% {
        transform: rotate(3.2deg);
      }
    }

    .sign-assembly {
      transform-origin: 50% 26px; /* Vantuzun asılı olduğu merkez nokta */
      animation: realisticSwing 4.5s ease-in-out infinite;
      will-change: transform;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Vantuz (Suction Cup) Saydam Cam & Vakum Efekti */
    .suction-cup {
      background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.88) 0%, rgba(200, 220, 240, 0.45) 45%, rgba(160, 185, 210, 0.25) 75%, rgba(100, 120, 150, 0.4) 100%);
      box-shadow: 
        0 4px 15px rgba(0, 0, 0, 0.35),
        inset 0 1px 3px rgba(255, 255, 255, 0.8),
        inset 0 -2px 6px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Metal Kanca */
    .metal-hook {
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 50%, #475569 100%);
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    /* Tabela Yüzeyi (Görseldeki bordo/kırmızı doku) */
    .board-texture {
      background: linear-gradient(160deg, #991b1b 0%, #831414 45%, #600d0d 100%);
      box-shadow: 
        0 22px 42px -8px rgba(0, 0, 0, 0.65),
        0 10px 20px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Cam Parlaması Katmanı */
    .sign-glare {
      background: linear-gradient(125deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 35%, transparent 55%);
      pointer-events: none;
    }

    /* Metalik Kuşgözü Delikleri */
    .grommet {
      background: radial-gradient(circle, #0f172a 35%, #94a3b8 40%, #cbd5e1 75%, #475569 100%);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 1px 2px rgba(255,255,255,0.4);
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-red-500 selection:text-white relative overflow-x-hidden">
  
  <!-- Arka Plan Görseli / Vitrin ve Kaldırım Dokusu -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800/60 via-slate-900/90 to-slate-950"></div>
    <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#94a3b8_1px,transparent_1px)] [background-size:24px_24px] blur-[1px]"></div>
    <div class="absolute inset-0 glass-window"></div>
  </div>

  <div class="relative z-10 w-full pt-8 sm:pt-12"></div>

  <!-- Ana İçerik: Merkezlenmiş Tabela ve Sade Bilgi -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-6">
    <div class="w-full max-w-xl flex flex-col items-center">
      
      <!-- TABELA DÜZENEĞİ (Vantuz + İp + Levha) -->
      <div class="sign-assembly relative w-full flex flex-col items-center cursor-pointer select-none" id="signContainer" title="Sallamak için dokunun">
        
        <!-- 1. Vantuz (Suction Cup) -->
        <div class="relative z-30 flex items-center justify-center">
          <div class="suction-cup w-14 h-14 rounded-full flex items-center justify-center">
            <div class="w-6 h-6 rounded-full bg-white/70 shadow-inner flex items-center justify-center">
              <div class="w-2.5 h-2.5 rounded-full bg-slate-600/40"></div>
            </div>
          </div>
          <div class="metal-hook absolute -bottom-2 w-3 h-5 rounded-b-full border border-slate-400/50"></div>
        </div>

        <!-- 2. Asma İpleri (SVG Vektör) -->
        <div class="w-[320px] sm:w-[420px] h-[95px] -mt-1 relative z-10 pointer-events-none">
          <svg class="w-full h-full drop-shadow-[0_6px_8px_rgba(0,0,0,0.5)]" viewBox="0 0 420 95" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 210 2 L 35 93" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M 210 2 L 35 93" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 3"/>
            <path d="M 210 2 L 385 93" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M 210 2 L 385 93" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 3"/>
            <circle cx="210" cy="4" r="3.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
          </svg>
        </div>

        <!-- 3. Bordo Tabela Gövdesi -->
        <div class="board-texture relative w-[310px] sm:w-[430px] h-[155px] sm:h-[190px] rounded-lg p-2.5 border-2 border-red-950/70 -mt-2 transition-transform duration-300">
          
          <!-- Parlama Katmanı -->
          <div class="sign-glare absolute inset-0 rounded-lg"></div>

          <!-- Perçin Kuşgözleri -->
          <div class="grommet absolute top-3 left-6 sm:left-7 w-4 h-4 rounded-full flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
          </div>
          <div class="grommet absolute top-3 right-6 sm:right-7 w-4 h-4 rounded-full flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
          </div>

          <!-- Beyaz İnce Çift Çerçeve -->
          <div class="w-full h-full border-[2.5px] border-white/95 rounded-md flex flex-col items-center justify-center relative p-3">
            <h1 class="font-sign text-3xl sm:text-5xl font-black text-white tracking-[0.2em] sm:tracking-[0.25em] pl-2 drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)]">
              KAPALI
            </h1>
            <p class="font-sign text-sm sm:text-lg font-bold text-red-100 tracking-[0.35em] pl-1.5 mt-0.5 opacity-90 drop-shadow-[0_1px_2px_rgba(0,0,0,0.5)]">
              CLOSED
            </p>
            <div class="absolute bottom-2.5 left-1/2 -translate-x-1/2 w-12 h-0.5 bg-white/40 rounded-full"></div>
          </div>
        </div>

        <!-- Tabela Arkası / Altı Yumuşak Gölge -->
        <div class="w-[280px] sm:w-[380px] h-4 bg-black/40 blur-md rounded-full mt-3"></div>
      </div>

      <!-- Sade ve Şık Bilgilendirme Metni -->
      <div class="w-full max-w-md mt-10 text-center bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-6 sm:p-7 shadow-2xl">
        <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">
          Şu Anda Hizmete Kapalıyız
        </h2>
        <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
          Akademik yoğunluğum ve operasyonel süreçleri sürdürmenin zorluğu nedeniyle hizmetimizi kalıcı olarak durdurduk. İlginiz için teşekkürler.
        </p>
      </div>

    </div>
  </main>

  <!-- Sade Alt Bilgi -->
  <footer class="relative z-10 w-full max-w-5xl mx-auto px-6 py-6 text-center text-xs text-slate-500">
    <p>&copy; Tüm Hakları Saklıdır.</p>
  </footer>

  <script>
    // Tabelaya tıklanıldığında / dokunulduğunda hafifçe hızlanan salınım efekti
    const sign = document.getElementById('signContainer');
    let isSwinging = false;

    sign.addEventListener('click', () => {
      if (isSwinging) return;
      isSwinging = true;
      
      sign.style.animation = 'realisticSwing 1.3s ease-in-out infinite';
      
      setTimeout(() => {
        sign.style.animation = 'realisticSwing 4.5s ease-in-out infinite';
        isSwinging = false;
      }, 3500);
    });
  </script>
</body>
</html>
